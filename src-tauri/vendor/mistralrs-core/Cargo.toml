# Vendored from mistral.rs v0.9.5; workspace inheritance resolved without changing dependency requirements.
[package]
name = "mistralrs-core"
publish = false
readme = "README.md"
authors = ["Eric Buehler"]
version = "0.9.5"
edition = "2021"
rust-version = "1.94"
description = "Fast, flexible LLM inference."
repository = "https://github.com/EricLBuehler/mistral.rs"
keywords = ["llm", "inference", "machine-learning", "ai", "transformers"]
categories = ["science", "api-bindings", "text-processing"]
license = "MIT"
homepage = "https://github.com/EricLBuehler/mistral.rs"

[dependencies]
anyhow = { version = "1.0.100" }
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c" }
metrics = { version = "0.24.6" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c" }
serde = { version = "1.0.228" }
serde_json = { version = "1.0.149" }
sha2 = { version = "0.10.9" }
tempfile = { version = "3" }
mistralrs-flash-attn = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2", optional = true }
dirs = { version = "6.0.0" }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "tokio", "rustls-tls"] }
thiserror = { version = "2.0.18" }
tokenizers = { version = "0.21.4", default-features = false }
tqdm = { version = "0.8.0" }
chrono = { version = "0.4.43" }
minijinja = { version = "2.14.0", features = ["builtins", "json", "preserve_order"] }
minijinja-contrib = { version = "2.14.0", features = ["pycompat"] }
either = { version = "1.15.0", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
mime_guess = { version = "2.0.5" }
half = { version = "2.7.1" }
accelerate-src = { version = "0.3.2", optional = true }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
tracing = { version = "0.1.44" }
rand = { version = "0.9.3" }
rand_distr = { version = "0.5.1" }
regex-automata = { version = "0.4.13", features = ["meta"] }
rustc-hash = { version = "2.1.1" }
vob = { version = "3.0.6" }
cfgrammar = { version = "0.14.1" }
lrtable = { version = "0.14.1" }
galil-seiferas = { version = "0.1.5" }
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
radix_trie = { version = "0.3.0" }
bytemuck = { version = "1.24.0" }
rayon = { version = "1.11.0" }
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tokio-rayon = { version = "2.1.0" }
rand_isaac = { version = "0.4.0" }
futures = { version = "0.3" }
pyo3 = { version = "0.25.1", features = ["full", "extension-module", "either", "abi3-py310"], optional = true }
indicatif = { version = "0.18.3", features = ["rayon"] }
async-trait = { version = "0.1.92" }
toml = { version = "0.9.11" }
strum = { version = "0.27.2", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
akin = { version = "0.4.0" }
variantly = { version = "0.4.0" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
itertools = { version = "0.14.0" }
sysinfo = { version = "0.36.1" }
mistralrs-vision = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2" }
csv = { version = "1.4.0" }
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls", "charset", "http2"] }
base64 = { version = "0.22.1" }
bytemuck_derive = { version = "1.10.2" }
mistralrs-paged-attn = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2", optional = true }
mistralrs-quant = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2" }
uuid = { version = "1.19.0", features = ["v4"] }
utoipa = { version = "5.4.0", optional = true }
schemars = { version = "1.2.0" }
serde-saphyr = { version = "0.0.16" }
regex = { version = "1.12.2" }
serde_plain = { version = "1.0.2" }
as-any = { version = "0.3.2" }
float8 = { version = "0.7.0" }
llguidance = { version = "1.2.0", default-features = false, features = ["lark"] }
toktrie_hf_tokenizers = { version = "1.2.0" }
toktrie = { version = "1.4.0" }
candle-flash-attn-v3 = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
safetensors = { version = "0.8.0" }
serde-big-array = { version = "0.5.1" }
interprocess = { version = "2.2.3" }
urlencoding = { version = "2.1.3" }
scraper = { version = "0.25.0" }
html2text = { version = "0.16.6" }
tokio-tungstenite = { version = "0.28.0" }
http = { version = "1.4.0" }
ordered-float = { version = "5.1.0" }
hashbrown = { version = "0.16.1" }
parking_lot = { version = "0.12.5" }
ahash = { version = "0.8.12" }
num-traits = { version = "0.2.19" }
libc = { version = "0.2.180" }
bm25 = { version = "2.3.2" }
rubato = { version = "0.16.2" }
rustfft = { version = "6.4.1" }
hound = { version = "3.5.1" }
apodize = { version = "1.0.0" }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "wav", "isomp4", "ogg", "pcm"] }
mistralrs-audio = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2" }
rust-mcp-schema = { version = "0.9.5", default-features = false, features = ["schema_utils", "latest"] }
mistralrs-mcp = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2", features = ["utoipa"] }
mistralrs-code-exec = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2" }
mistralrs-sandbox = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2" }
statrs = { version = "0.18.0" }
openai-harmony = "0.0.8"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc = { version = "0.2.7", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
dispatch2 = { version = "0.3.0", default-features = false, features = ["block2"], optional = true }
mistralrs-metal-compile = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2", optional = true, features = ["metal"] }

[features]
pyo3_macros = ["pyo3", "mistralrs-mcp/pyo3_macros"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "dep:cudaforge",
    "mistralrs-quant/cuda",
    "dep:mistralrs-paged-attn",
    "mistralrs-paged-attn/cuda",
]
cudnn = ["candle-core/cudnn"]
cutile = ["cuda", "mistralrs-quant/cutile"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "mistralrs-quant/metal",
    "dep:candle-metal-kernels",
    "dep:objc",
    "dep:mistralrs-paged-attn",
    "mistralrs-paged-attn/metal",
    "dep:objc2-metal",
    "dep:dispatch2",
    "dep:mistralrs-metal-compile",
]
flash-attn = ["cuda", "dep:mistralrs-flash-attn", "mistralrs-flash-attn/cuda"]
flash-attn-v3 = ["cuda", "dep:candle-flash-attn-v3"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "mistralrs-quant/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
nccl = ["cuda", "mistralrs-quant/nccl"]
utoipa = ["dep:utoipa"]
ring = ["mistralrs-quant/ring"]
code-execution = []

[build-dependencies]
cudaforge = { version = "=0.1.6", optional = true }
mistralrs-metal-compile = { version = "0.9.5", git = "https://github.com/EricLBuehler/mistral.rs", rev = "465191d0b0a7e2432d327b0de06204ab3f94d3a2", optional = true }

[package.metadata.ragtag]
upstream-version = "0.9.5"
upstream-revision = "465191d0b0a7e2432d327b0de06204ab3f94d3a2"
patch-revision = "ragtag.1"
patch-purpose = "Contiguous batched logits selection for quantized output projection."
