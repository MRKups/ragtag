[workspace]
members = [
    ".",
    "crates/*"
]
resolver = "2"

[package]
name = "mrk-ragtag-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
rag_pipeline = { path = "crates/rag_pipeline" }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "=0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
sha2 = "0.11.0"
jiff = "0.2.35"
uuid = { version = "1.26.0", features = ["v7"] }
fastembed = "=6.0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
keyring = "4.1.6"
hf-hub = "1.0.0"
futures-util = "0.3.34"
log = "0.4.34"
env_logger = "0.11.11"
percent-encoding = "2.3.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mistralrs = { version = "=0.8.1", features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
mistralrs = "=0.8.1"

[profile.dev]
# Keep source locations and backtraces while avoiding full debug metadata for
# mistralrs, LanceDB, Arrow, and their large dependency graphs.
opt-level = 1
debug = 1
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
