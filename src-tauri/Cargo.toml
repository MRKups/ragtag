[workspace]
members = [
    ".",
    "crates/*"
]
resolver = "2"

[package]
name = "mrk-ragtag-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = "2"

[dependencies]
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
rag_pipeline = { path = "crates/rag_pipeline" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
jiff = "0.2"
uuid = { version = "1", features = ["v7"] }
fastembed = "=5.12.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
