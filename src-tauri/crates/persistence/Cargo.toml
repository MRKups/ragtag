[package]
name = "persistence"
version = "0.1.0"
edition = "2024"
description = "SQLite registry and embedded LanceDB vector storage for Ragtag"
authors = ["Michal Kups"]
license = "MIT"
repository = "https://github.com/MRKups/ragtag"

[dependencies]
domain = { path = "../domain" }
sqlx = { version = "=0.9.1", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
lancedb = "=0.41.0"
arrow-array = "=58.4.2"
arrow-schema = "=58.4.2"
futures = "0.3.34"
log = "0.4.35"
sha2 = "0.11.2"
uuid = { version = "1.29.3", features = ["v7"] }
keyring = "4.2.0"
serde_json = "1.0.154"
