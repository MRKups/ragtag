[package]
name = "persistence"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
jiff = "0.2"
lancedb = "=0.26.2"
arrow-array = "57.2"
arrow-schema = "57.2"
futures = "0.3.32"
lance-index = "=2.0.0"
log = "0.4"
