[package]
name = "persistence"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
sqlx = { version = "=0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
lancedb = "=0.37.1"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
futures = "0.3.34"
log = "0.4.34"
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v7"] }
keyring = "4.2.0"
serde_json = "1.0.151"
