version: '3'

vars:
  FRONTEND_DIR: frontend
  TAURI_DIR: src-tauri
  INTEL_ORT_ROOT:
    sh: 'printf "%s" "${RAGTAG_INTEL_ORT_ROOT:-$HOME/.cache/mrk-ragtag/onnxruntime-1.28.0}"'
  INTEL_ORT_LIB: '{{.INTEL_ORT_ROOT}}/build/MacOS/Release'

env:
  RUST_BACKTRACE: 1

tasks:
  setup-frontend:
    desc: Install frontend dependencies for Intel development
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm install

  intel-runtime:
    internal: true
    desc: Verify the external Intel ONNX Runtime development dependency
    preconditions:
      - sh: test "$(uname -m)" = x86_64
        msg: Intel development tasks require an x86_64 macOS host.
      - sh: test -f '{{.INTEL_ORT_LIB}}/libonnxruntime.dylib'
        msg: External ONNX Runtime is missing. Set RAGTAG_INTEL_ORT_ROOT to its external location.
    cmds:
      - |
          case "$(file '{{.INTEL_ORT_LIB}}/libonnxruntime.dylib')" in
            *x86_64*) ;;
            *) echo "Expected an x86_64 ONNX Runtime dylib at {{.INTEL_ORT_LIB}}." >&2; exit 1 ;;
          esac

  dev:
    desc: Run Intel macOS development build with external ONNX Runtime
    deps: [setup-frontend, intel-runtime]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - |
          export ORT_LIB_LOCATION='{{.INTEL_ORT_LIB}}'
          export ORT_PREFER_DYNAMIC_LINK=1
          export DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$ORT_LIB_LOCATION"
          cargo tauri dev

  build:
    desc: Compile Intel macOS debug application with external ONNX Runtime
    deps: [intel-runtime]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - |
          export ORT_LIB_LOCATION='{{.INTEL_ORT_LIB}}'
          export ORT_PREFER_DYNAMIC_LINK=1
          export DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$ORT_LIB_LOCATION"
          cargo build
