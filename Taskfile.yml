version: '3'

vars:
  FRONTEND_DIR: frontend
  TAURI_DIR: src-tauri
  RELEASE_BIN: target/release/mrk-ragtag-app
  INTEL_ORT_VERSION: '1.28.0'
  INTEL_ORT_ROOT:
    sh: 'printf "%s" "${RAGTAG_INTEL_ORT_ROOT:-$HOME/.cache/mrk-ragtag/onnxruntime-{{.INTEL_ORT_VERSION}}}"'
  INTEL_ORT_LIB: '{{.INTEL_ORT_ROOT}}/build/MacOS/Release'
  INTEL_TARGET_DIR: target/intel

env:
  RUST_BACKTRACE: 1

tasks:
  default:
    desc: Start HMR development mode
    deps: [dev]

  setup:
    desc: Install all dependencies (npm + verify Rust)
    cmds:
      - task: setup-frontend
      - task: setup-rust

  setup-frontend:
    desc: Install frontend npm dependencies
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm install

  setup-rust:
    desc: Verify Rust toolchain is installed
    cmds:
      - cargo --version
      - rustc --version

  dev:
    desc: Run app in HMR development mode (Tauri + Vite dev server)
    deps: [setup-frontend]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - cargo tauri dev

  intel-runtime:
    internal: true
    desc: Verify the external Intel ONNX Runtime development dependency
    preconditions:
      - sh: test "$(uname -m)" = x86_64
        msg: Intel development tasks require an x86_64 macOS host.
      - sh: test -f '{{.INTEL_ORT_LIB}}/libonnxruntime.dylib'
        msg: External ONNX Runtime is missing. Follow README.md's Intel macOS development setup or set RAGTAG_INTEL_ORT_ROOT.
      - sh: test "$(cat '{{.INTEL_ORT_ROOT}}/VERSION_NUMBER')" = '{{.INTEL_ORT_VERSION}}'
        msg: External ONNX Runtime must be version {{.INTEL_ORT_VERSION}}.
      - sh: test -f '{{.INTEL_ORT_LIB}}/libonnxruntime.{{.INTEL_ORT_VERSION}}.dylib'
        msg: External ONNX Runtime {{.INTEL_ORT_VERSION}} library is missing.
    cmds:
      - |
          case "$(file '{{.INTEL_ORT_LIB}}/libonnxruntime.dylib')" in
            *x86_64*) ;;
            *) echo "Expected an x86_64 ONNX Runtime dylib at {{.INTEL_ORT_LIB}}." >&2; exit 1 ;;
          esac

  dev-intel:
    desc: Run the Intel macOS development build with external ONNX Runtime
    deps: [setup-frontend, intel-runtime]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - |
          export ORT_LIB_LOCATION='{{.INTEL_ORT_LIB}}'
          export ORT_PREFER_DYNAMIC_LINK=1
          export DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$ORT_LIB_LOCATION"
          export CARGO_TARGET_DIR='{{.INTEL_TARGET_DIR}}'
          cargo tauri dev

  build-intel:
    desc: Compile the Intel macOS debug application with external ONNX Runtime
    deps: [intel-runtime]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - |
          export ORT_LIB_LOCATION='{{.INTEL_ORT_LIB}}'
          export ORT_PREFER_DYNAMIC_LINK=1
          export DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$ORT_LIB_LOCATION"
          export CARGO_TARGET_DIR='{{.INTEL_TARGET_DIR}}'
          cargo build


  build:
    desc: Build release binary
    deps: [check, build-frontend]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - cargo tauri build --no-bundle
    generates:
      - '{{.RELEASE_BIN}}'

  bundle:
    desc: Build distributable macOS .app bundle
    deps: [check, build-frontend]
    dir: '{{.TAURI_DIR}}'
    cmds:
      - cargo tauri build
    generates:
      - target/release/bundle/macos/Ragtag.app

  build-frontend:
    desc: Build frontend Vite production bundle
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run build

  check:
    desc: Run TypeScript and Svelte type-checking
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run check

  clean:
    desc: Remove all build artifacts
    cmds:
      - task: clean-frontend
      - task: clean-rust

  clean-frontend:
    desc: Clean frontend build output
    silent: true
    cmds:
      - rm -rf '{{.FRONTEND_DIR}}/dist'
      - rm -rf '{{.FRONTEND_DIR}}/node_modules/.vite'

  clean-rust:
    desc: Clean Rust build artifacts
    silent: true
    dir: '{{.TAURI_DIR}}'
    cmds:
      - cargo clean
